<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="60" cy="60" r="58" fill="#42b983" stroke="#33a06f" stroke-width="2"/>
  
  <!-- 装饰性几何图案 -->
  <path d="M 30 40 L 50 40 L 50 50 L 40 50 L 40 60 L 30 60 Z" fill="rgba(255,255,255,0.2)"/>
  <path d="M 70 60 L 90 60 L 90 70 L 80 70 L 80 80 L 70 80 Z" fill="rgba(255,255,255,0.2)"/>
  
  <!-- "如简"文字 -->
  <text x="60" y="75" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">
    如简
  </text>
  
  <!-- 装饰线条 -->
  <line x1="25" y1="85" x2="95" y2="85" stroke="white" stroke-width="2" opacity="0.6"/>
</svg>
